version: 2
updates:
  - package-ecosystem: npm
    directory: "/web-src"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
